services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: ${DB_USER:-task}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-task}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d taskdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]

  # Lancé seulement avec : docker compose --profile full up --build
  api:
    profiles: ["full"]
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/taskdb
      DB_USER: ${DB_USER:-task}
      DB_PASSWORD: ${DB_PASSWORD:-task}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      # Aucun repli : sans JWT_SECRET, l'API refuse de démarrer (ouvrir la session avec JWT_SECRET=...)
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
