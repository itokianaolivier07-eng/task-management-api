# --- Profil « prod » (SPRING_PROFILES_ACTIVE=prod) ---
# Aucune valeur par défaut : si JWT_SECRET ou DB_PASSWORD est absent, l'application refuse de démarrer.
jwt.secret=${JWT_SECRET}
spring.datasource.password=${DB_PASSWORD}

# Cookie de session envoyé uniquement en HTTPS.
app.cookie.secure=${COOKIE_SECURE:true}

# SMTP réel (les e-mails de confirmation sont indispensables : plus de Mailpit en production)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.mail.from=${MAIL_FROM:no-reply@taskflow.local}

# Le schéma n'est plus modifié automatiquement (ddl-auto=update est réservé au développement).
spring.jpa.hibernate.ddl-auto=validate

# Le schéma est créé/mis à jour par les migrations Flyway (src/main/resources/db/migration).
spring.flyway.enabled=true
