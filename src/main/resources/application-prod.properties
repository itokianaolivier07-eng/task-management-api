# --- Profil « prod » (SPRING_PROFILES_ACTIVE=prod) ---
# Aucune valeur par défaut : si JWT_SECRET ou DB_PASSWORD est absent, l'application refuse de démarrer.
jwt.secret=${JWT_SECRET}
spring.datasource.password=${DB_PASSWORD}

# Le schéma n'est plus modifié automatiquement (ddl-auto=update est réservé au développement).
spring.jpa.hibernate.ddl-auto=validate

# Le schéma est créé/mis à jour par les migrations Flyway (src/main/resources/db/migration).
spring.flyway.enabled=true
