spring.application.name=task-management-api

# --- Base de données (valeurs par défaut = docker-compose.yml) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${DB_USER:task}
spring.datasource.password=${DB_PASSWORD:task}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Migrations : désactivées en dev (Hibernate gère le schéma) ; activées dans le profil prod ---
spring.flyway.enabled=false

# --- JWT : la valeur par défaut est réservée au développement ---
# En production, activer le profil « prod » : JWT_SECRET devient obligatoire (aucun secret par défaut).
# Clé Base64 d'au moins 32 octets : openssl rand -base64 32
jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
jwt.expiration=${JWT_EXPIRATION:7200000}
jwt.issuer=task-management-api

# --- Cookie de session : Secure = HTTPS uniquement (false en dev http://localhost, true en prod)
app.cookie.secure=${COOKIE_SECURE:false}

# --- E-mails (Mailpit en local : interface sur http://localhost:8025) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}
app.mail.from=${MAIL_FROM:no-reply@taskflow.local}

# --- URL publique du front (liens des e-mails de confirmation / réinitialisation)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# --- Inscriptions : REGISTRATION_ENABLED=false les ferme ; ALLOWED_EMAIL_DOMAINS=societe.com,autre.org les restreint
app.registration.enabled=${REGISTRATION_ENABLED:true}
app.registration.allowed-email-domains=${ALLOWED_EMAIL_DOMAINS:}

# --- CORS : origines autorisées pour le front (séparées par des virgules) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Rappels d'échéance : tous les jours à 8h (secondes minutes heures jour mois jour-semaine) ---
app.reminders.cron=${REMINDERS_CRON:0 0 8 * * *}

# --- Derrière un reverse proxy (nginx du front) : lire X-Forwarded-For / -Proto ---
server.forward-headers-strategy=native
